<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBridge — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8fafc; color: #1e293b; }
      .container { text-align: center; padding: 2rem; }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #1e3a5f; }
      p { color: #64748b; margin-bottom: 1.5rem; }
      button { background: #1e3a5f; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're offline</h1>
      <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
